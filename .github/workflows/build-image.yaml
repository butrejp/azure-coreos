name: Build and Push Azure Linux 4.0 Image

on:
  push:
    branches: [ "main" ]

# Grant the GITHUB_TOKEN permission to write packages to GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # This automatically converts your image name to "/your-username/repository-name" format
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository files
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up the Docker build environment
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Log into GitHub Container Registry using the automatic system token
    - name: Log into Registry (${{ env.REGISTRY }})
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 4. Extract metadata (tags, labels) for Docker to format names to lowercase
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=sha,format=short

    # 5. Build the image and push it to GHCR
    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
